# XcodeGen spec for iosApp.xcodeproj. The generated project is committed, so building doesn't need
# XcodeGen; after editing this file, regenerate with `xcodegen generate` from this directory.
name: iosApp
options:
  bundleIdPrefix: com.ruidoespontaneo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 5 mode: the Kotlin framework's classes aren't Sendable, which Swift 6 mode rejects.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # The same font files the Android app bundles, referenced in place rather than copied.
      - path: ../cover/src/main/res/font/pixelify_sans.ttf
        buildPhase: resources
      - path: ../cover/src/main/res/font/handjet.ttf
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Cassette
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [pixelify_sans.ttf, handjet.ttf]
        # Previews keep playing with the screen off or the app in the background.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_NAME: Cassette
        PRODUCT_BUNDLE_IDENTIFIER: com.ruidoespontaneo.cassette
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Where :data:embedAndSignAppleFrameworkForXcode puts Shared.framework.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../data/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
        # The Gradle build phase reads and writes outside the sandboxed paths.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Builds :data's Shared framework for the SDK and architecture Xcode is building for.
          # ./gradlew needs a JDK; fall back to Android Studio's bundled one when JAVA_HOME isn't set.
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          fi
          cd "$SRCROOT/.."
          ./gradlew :data:embedAndSignAppleFrameworkForXcode
