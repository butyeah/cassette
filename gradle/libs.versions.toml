[versions]
agp = "9.4.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.11.0"
hiltNavigationCompose = "1.4.0"
kotlinxCoroutines = "1.11.0"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# Pinned above the BOM (which maps to 1.4.0) for HorizontalFloatingToolbar, which only exists in 1.5.0 alphas.
material3 = "1.5.0-alpha29"
ksp = "2.3.12"
# Pinned above what Ktor 3.2 and Coil ask for (4.12), to keep the version the app already shipped.
okhttp = "5.5.0"
hilt = "2.60.1"
desugarJdkLibs = "2.1.5"
firebaseBom = "34.18.0"
googleServices = "4.5.0"
navigationCompose = "2.10.1"
credentials = "1.6.0"
googleid = "1.2.0"
workRuntimeKtx = "2.11.2"
datastorePreferences = "1.2.1"
timber = "5.0.1"
firebaseCrashlyticsPlugin = "3.0.8"
coil = "3.4.0"
haze = "1.7.3"
palette = "1.0.0"
media3 = "1.11.1"
kotlinxDatetime = "0.8.0"
# 3.2.x is the newest Ktor built against Kotlin 2.1/2.2; 3.3+ needs a newer Kotlin than ours (2.2.10).
ktor = "3.2.4"
kotlinxSerialization = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
